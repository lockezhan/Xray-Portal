<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA 双因子安全认证 · 赛博工作台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=PingFang+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- OTPAuth 纯前端离线生成库 -->
    <script src="https://cdn.jsdelivr.net/npm/otpauth@9.2.2/dist/otpauth.umd.min.js"></script>

    <style>
        :root {
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0b0f19 60%, #030712 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === 🌟 00Kubi (cowardly-eagle-56) 赛博 3D 悬浮卡片体系 === */
        .cyber-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            min-height: 380px;
            transition: 300ms ease;
        }

        .canvas {
            perspective: 800px;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .cyber-card {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: stretch;
            border-radius: 2rem;
            transition: 500ms cubic-bezier(0.16, 1, 0.3, 1);
            background: linear-gradient(135deg, rgba(20, 24, 38, 0.88) 0%, rgba(10, 15, 29, 0.95) 100%);
            border: 1.5px solid rgba(92, 103, 255, 0.35);
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.6),
                0 0 25px -5px rgba(92, 103, 255, 0.25),
                inset 0 0 25px rgba(92, 103, 255, 0.12);
            padding: 2.2rem;
            backdrop-filter: blur(20px);
        }

        .cyber-card:hover {
            border-color: rgba(92, 103, 255, 0.8);
            box-shadow:
                0 0 50px rgba(92, 103, 255, 0.35),
                0 0 30px rgba(0, 255, 170, 0.2),
                inset 0 0 30px rgba(92, 103, 255, 0.2);
            transform: translateY(-4px);
        }

        /* 3D 镜面倾斜扫光 */
        .card-glare {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                125deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.04) 45%,
                rgba(255, 255, 255, 0.12) 50%,
                rgba(255, 255, 255, 0.04) 55%,
                rgba(255, 255, 255, 0) 100%
            );
            opacity: 0;
            transition: opacity 300ms;
            pointer-events: none;
        }

        .cyber-card:hover .card-glare {
            opacity: 1;
        }

        /* 赛博动态横向光线 */
        .cyber-lines span {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(92, 103, 255, 0.4), transparent);
            pointer-events: none;
        }

        .cyber-lines span:nth-child(1) {
            top: 20%; left: 0; width: 100%; height: 1px;
            transform: scaleX(0); transform-origin: left;
            animation: lineGrow 3.5s linear infinite;
        }
        .cyber-lines span:nth-child(2) {
            top: 45%; right: 0; width: 100%; height: 1px;
            transform: scaleX(0); transform-origin: right;
            animation: lineGrow 3.5s linear infinite 1s;
        }
        .cyber-lines span:nth-child(3) {
            top: 70%; left: 0; width: 100%; height: 1px;
            transform: scaleX(0); transform-origin: left;
            animation: lineGrow 3.5s linear infinite 2s;
        }
        .cyber-lines span:nth-child(4) {
            top: 90%; right: 0; width: 100%; height: 1px;
            transform: scaleX(0); transform-origin: right;
            animation: lineGrow 3.5s linear infinite 1.5s;
        }

        @keyframes lineGrow {
            0% { transform: scaleX(0); opacity: 0; }
            50% { transform: scaleX(1); opacity: 0.8; }
            100% { transform: scaleX(0); opacity: 0; }
        }

        /* 垂直激光扫描线 */
        .scan-line {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(92, 103, 255, 0.15), transparent);
            transform: translateY(-100%);
            animation: scanMove 2.8s linear infinite;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 四角高科技准心边框 */
        .corner-elements span {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(92, 103, 255, 0.4);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .corner-elements span:nth-child(1) { top: 12px; left: 12px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
        .corner-elements span:nth-child(2) { top: 12px; right: 12px; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; }
        .corner-elements span:nth-child(3) { bottom: 12px; left: 12px; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; }
        .corner-elements span:nth-child(4) { bottom: 12px; right: 12px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }

        .cyber-card:hover .corner-elements span {
            border-color: rgba(0, 255, 170, 0.85);
            box-shadow: 0 0 12px rgba(0, 255, 170, 0.5);
        }

        /* 内部发光光晕 */
        .glowing-elements {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .glow-1 {
            position: absolute;
            top: -20px; left: 20%;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 170, 0.25) 0%, transparent 70%);
            filter: blur(20px);
        }
        .glow-2 {
            position: absolute;
            bottom: -20px; right: 20%;
            width: 140px; height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(92, 103, 255, 0.3) 0%, transparent 70%);
            filter: blur(25px);
        }

        /* === 🌟 mymiamo (yellow-rattlesnake-26) 风格 iOS 胶囊发光按钮 === */
        .btn-mymiamo {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999rem;
            padding: 0.75rem 1.6rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow:
                inset 2px 2px 5px -2px rgba(255, 255, 255, 0.55),
                inset -2px -1px 5px 0 rgba(255, 255, 255, 0.45),
                inset 0 -2px 0 rgba(255, 255, 255, 0.25),
                0 10px 25px -4px rgba(79, 70, 229, 0.35);
            transition:
                background 0.22s var(--ease-spring),
                transform 0.22s var(--ease-spring),
                box-shadow 0.25s ease-in-out;
        }

        .btn-mymiamo:hover {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transform: translateY(-2px) scale(1.02);
            box-shadow:
                inset 2px 2px 6px -1px rgba(255, 255, 255, 0.8),
                inset -2px -1px 6px 1px rgba(255, 255, 255, 0.6),
                inset 0 -2px 0 rgba(255, 255, 255, 0.4),
                0 16px 32px -6px rgba(99, 102, 241, 0.5);
        }

        .btn-mymiamo:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999rem;
            padding: 0.75rem 1.4rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
        }

        /* 验证码霓虹发光文字 */
        .totp-code-neon {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 8px;
            background: linear-gradient(45deg, #00ffaa, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 255, 170, 0.4));
            user-select: all;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .totp-code-neon:hover {
            transform: scale(1.04);
        }

        /* Toast 提示 */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            padding: 0.85rem 1.4rem;
            border-radius: 999rem;
            font-size: 0.875rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.95), rgba(168, 85, 247, 0.95));
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            backdrop-filter: blur(16px);
            opacity: 0;
            transform: translateY(12px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body class="p-4 sm:p-6 md:p-10">

    <!-- Toast 容器 -->
    <div id="toast">已复制到剪贴板！</div>

    <!-- 顶部导航面包屑 -->
    <div class="w-full max-w-4xl mx-auto mb-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="/" class="px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 text-xs font-bold transition-all flex items-center gap-1.5">
                🏠 <span>首页</span>
            </a>
            <span class="text-slate-600">/</span>
            <span class="text-sm font-extrabold text-white flex items-center gap-1.5">
                🔑 <span>2FA 双因子认证</span>
            </span>
        </div>
        <span class="px-3 py-1 rounded-full text-[11px] font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            纯前端本地离线运算 · 云端安全加密同步
        </span>
    </div>

    <!-- 核心区域：00Kubi 赛博 3D 验证卡片 -->
    <div class="cyber-container my-4">
        <div class="canvas">
            <div class="cyber-card">
                <!-- 镜面反光层 -->
                <div class="card-glare"></div>

                <!-- 赛博横向生长光线 -->
                <div class="cyber-lines">
                    <span></span><span></span><span></span><span></span>
                </div>

                <!-- 四角科技准心 -->
                <div class="corner-elements">
                    <span></span><span></span><span></span><span></span>
                </div>

                <!-- 垂直激光扫描线 -->
                <div class="scan-line"></div>

                <!-- 内部光晕 -->
                <div class="glowing-elements">
                    <div class="glow-1"></div>
                    <div class="glow-2"></div>
                </div>

                <!-- 卡片内部核心内容 -->
                <div class="relative z-10 flex flex-col items-center justify-between h-full">
                    <!-- 顶部标题 -->
                    <div class="w-full flex items-center justify-between border-b border-white/10 pb-3">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping shrink-0"></span>
                            <h3 class="text-xs uppercase tracking-widest font-extrabold text-cyan-300 truncate" id="current-account-name">DEFAULT ACCOUNT</h3>
                        </div>
                        <span class="text-[11px] font-mono text-slate-400 shrink-0" id="period-indicator">30s 周期</span>
                    </div>

                    <!-- 中央：大号 TOTP 验证码 -->
                    <div class="my-6 text-center" onclick="copyCurrentCode()">
                        <div class="text-[11px] font-mono tracking-widest text-slate-400 mb-1">CURRENT OTP TOKEN (点击复制)</div>
                        <div class="totp-code-neon" id="totp-code-display">------</div>
                        <div class="text-xs text-slate-400 mt-2 font-mono flex items-center justify-center gap-1.5">
                            <span>剩余有效时间:</span>
                            <span class="text-cyan-400 font-bold text-sm" id="time-remaining">30</span>
                            <span>秒</span>
                        </div>
                    </div>

                    <!-- 底部：倒计时动态进度条 -->
                    <div class="w-full">
                        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-4">
                            <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-400 via-cyan-400 to-indigo-500 rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
                        </div>

                        <div class="flex gap-2.5 w-full">
                            <button onclick="copyCurrentCode()" class="btn-mymiamo flex-1 !py-2.5 text-xs">
                                📋 复制动态码
                            </button>
                            <button onclick="document.getElementById('secret-input').focus()" class="btn-secondary !py-2.5 text-xs">
                                ✏️ 切换密钥
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 下方：密钥配置与多账号管理区 -->
    <div class="w-full max-w-xl mx-auto mt-6 bg-slate-900/70 border border-white/10 rounded-3xl p-6 backdrop-blur-xl shadow-2xl">
        <h4 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
            <span>⚙️ 密钥输入与解析</span>
            <span class="text-[11px] text-slate-400 font-normal">支持 Base32 密钥或 otpauth:// 协议链接</span>
        </h4>
        
        <div class="space-y-3">
            <div>
                <input type="text" id="secret-input" oninput="onSecretChange()" placeholder="例如: JBSWY3DPEHPK3PXP 或 otpauth://totp/GitHub:user?secret=..." 
                    class="w-full px-4 py-3 bg-slate-950/80 border border-slate-700/80 focus:border-cyan-400 rounded-2xl text-xs font-mono text-cyan-300 focus:outline-none transition-all shadow-inner">
            </div>
            
            <div class="flex gap-2 justify-between items-center">
                <input type="text" id="account-name-input" placeholder="账户备注 (如 GitHub / Google / Azure)" 
                    class="flex-1 px-4 py-2.5 bg-slate-950/80 border border-slate-700/80 focus:border-cyan-400 rounded-xl text-xs text-white focus:outline-none">
                
                <button onclick="saveCurrentAccount()" class="btn-mymiamo !px-5 !py-2.5 !text-xs shrink-0">
                    💾 保存至云端
                </button>
            </div>
        </div>

        <!-- 存储的账户列表 -->
        <div class="mt-6 pt-5 border-t border-white/10">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-slate-300">📁 已保存的 2FA 账户</span>
                <span class="text-[11px] text-slate-500 font-mono" id="saved-count">0 个账户</span>
            </div>
            <div id="accounts-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <script>
    let currentSecret = localStorage.getItem('last_2fa_secret') || "JBSWY3DPEHPK3PXP";
    let currentAccountName = localStorage.getItem('last_2fa_name') || "Demo Account";
    let savedAccounts = JSON.parse(localStorage.getItem('2fa_accounts') || '[]');

    document.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('secret-input').value = currentSecret;
        document.getElementById('account-name-input').value = currentAccountName;
        
        // 尝试从服务端同步云端 2FA 账户
        await syncFromCloud();
        renderSavedAccounts();
        updateTOTP();
        setInterval(updateTOTP, 1000);
    });

    async function syncFromCloud() {
        try {
            const resp = await fetch('/api/2fa/accounts');
            if (resp.ok) {
                const cloudData = await resp.json();
                if (Array.isArray(cloudData) && cloudData.length > 0) {
                    savedAccounts = cloudData;
                    localStorage.setItem('2fa_accounts', JSON.stringify(savedAccounts));
                    if (!currentSecret && savedAccounts.length > 0) {
                        currentAccountName = savedAccounts[0].name;
                        currentSecret = savedAccounts[0].secret;
                        document.getElementById('secret-input').value = currentSecret;
                        document.getElementById('account-name-input').value = currentAccountName;
                    }
                }
            }
        } catch(e) {}
    }

    async function pushToCloud() {
        try {
            await fetch('/api/2fa/accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(savedAccounts)
            });
        } catch(e) {}
    }

    function cleanSecret(raw) {
        if (!raw) return "";
        raw = raw.trim();
        if (raw.startsWith('otpauth://')) {
            try {
                const parsed = OTPAuth.URI.parse(raw);
                if (parsed && parsed.secret) {
                    if (parsed.label) {
                        currentAccountName = decodeURIComponent(parsed.label);
                        document.getElementById('account-name-input').value = currentAccountName;
                    }
                    return parsed.secret.base32;
                }
            } catch(e) {}
        }
        return raw.replace(/[\s-]/g, '').toUpperCase();
    }

    function onSecretChange() {
        const raw = document.getElementById('secret-input').value;
        const cleaned = cleanSecret(raw);
        if (cleaned) {
            currentSecret = cleaned;
            localStorage.setItem('last_2fa_secret', currentSecret);
            updateTOTP(true);
        }
    }

    function updateTOTP(immediate = false) {
        const epoch = Math.floor(Date.now() / 1000);
        const remaining = 30 - (epoch % 30);
        
        document.getElementById('time-remaining').textContent = remaining;
        document.getElementById('progress-bar').style.width = `${(remaining / 30) * 100}%`;
        document.getElementById('current-account-name').textContent = currentAccountName || "TOTP ACCOUNT";

        try {
            if (!currentSecret) {
                document.getElementById('totp-code-display').textContent = "------";
                return;
            }
            const totp = new OTPAuth.TOTP({
                issuer: 'Xray-Portal',
                label: currentAccountName,
                algorithm: 'SHA1',
                digits: 6,
                period: 30,
                secret: OTPAuth.Secret.fromBase32(currentSecret)
            });
            const token = totp.generate();
            document.getElementById('totp-code-display').textContent = `${token.slice(0, 3)} ${token.slice(3)}`;
        } catch (e) {
            document.getElementById('totp-code-display').textContent = "INVALID";
        }
    }

    function copyCurrentCode() {
        const rawCode = document.getElementById('totp-code-display').textContent.replace(/\s+/g, '');
        if (!rawCode || rawCode === '------' || rawCode === 'INVALID') return;
        navigator.clipboard.writeText(rawCode).then(() => {
            showToast(`已复制动态验证码: ${rawCode}`);
        });
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => {
            t.classList.remove('show');
        }, 2200);
    }

    async function saveCurrentAccount() {
        const secret = cleanSecret(document.getElementById('secret-input').value);
        const name = document.getElementById('account-name-input').value.trim() || "未命名账户";
        if (!secret) {
            showToast("请输入有效的 Base32 密钥！");
            return;
        }

        const idx = savedAccounts.findIndex(a => a.name === name);
        if (idx !== -1) {
            savedAccounts[idx].secret = secret;
        } else {
            savedAccounts.push({ name, secret });
        }
        localStorage.setItem('2fa_accounts', JSON.stringify(savedAccounts));
        currentAccountName = name;
        currentSecret = secret;
        localStorage.setItem('last_2fa_name', name);
        localStorage.setItem('last_2fa_secret', secret);
        renderSavedAccounts();
        await pushToCloud();
        showToast("已安全保存并同步至云端！");
    }

    function renderSavedAccounts() {
        const container = document.getElementById('accounts-list');
        document.getElementById('saved-count').textContent = `${savedAccounts.length} 个账户`;

        if (savedAccounts.length === 0) {
            container.innerHTML = '<div class="text-center py-4 text-xs text-slate-500">暂无保存的账户，在上方填入后点击“保存至云端”</div>';
            return;
        }

        container.innerHTML = "";
        savedAccounts.forEach((acc, i) => {
            let code = "------";
            try {
                const totp = new OTPAuth.TOTP({
                    algorithm: 'SHA1',
                    digits: 6,
                    period: 30,
                    secret: OTPAuth.Secret.fromBase32(acc.secret)
                });
                code = totp.generate();
            } catch(e) {}

            const div = document.createElement('div');
            div.className = "flex items-center justify-between p-3 rounded-2xl bg-slate-950/60 border border-white/5 hover:border-cyan-500/40 transition-all";
            div.innerHTML = `
                <div class="cursor-pointer min-w-0 flex-1 mr-2" onclick="selectAccount(${i})">
                    <div class="text-xs font-bold text-slate-200 truncate">${acc.name}</div>
                    <div class="text-cyan-400 font-mono font-bold text-sm tracking-wider mt-0.5">${code.slice(0,3)} ${code.slice(3)}</div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="copyCodeDirect('${code}')" class="px-3 py-1.5 bg-white/10 hover:bg-cyan-500/20 text-cyan-300 rounded-full text-xs font-mono font-bold transition-all cursor-pointer">
                        复制
                    </button>
                    <button onclick="deleteAccount(${i})" class="px-2.5 py-1.5 hover:bg-rose-500/20 text-rose-400 rounded-full text-xs transition-all cursor-pointer">
                        ✕
                    </button>
                </div>`;
            container.appendChild(div);
        });
    }

    function selectAccount(index) {
        const acc = savedAccounts[index];
        if (!acc) return;
        currentAccountName = acc.name;
        currentSecret = acc.secret;
        document.getElementById('secret-input').value = acc.secret;
        document.getElementById('account-name-input').value = acc.name;
        localStorage.setItem('last_2fa_name', acc.name);
        localStorage.setItem('last_2fa_secret', acc.secret);
        updateTOTP();
        showToast(`已切换至: ${acc.name}`);
    }

    function copyCodeDirect(code) {
        const raw = code.replace(/\s+/g, '');
        navigator.clipboard.writeText(raw).then(() => {
            showToast(`已复制动态验证码: ${raw}`);
        });
    }

    async function deleteAccount(index) {
        if (!confirm("确定要删除此 2FA 账户吗？")) return;
        savedAccounts.splice(index, 1);
        localStorage.setItem('2fa_accounts', JSON.stringify(savedAccounts));
        renderSavedAccounts();
        await pushToCloud();
        showToast("已删除该账户");
    }
    </script>
</body>
</html>
