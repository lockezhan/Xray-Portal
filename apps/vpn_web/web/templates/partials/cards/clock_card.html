<!-- Real-time clock widget -->
<div class="glass-panel glass-card-hover p-6 rounded-[2.2rem] shadow-sm relative overflow-hidden">
    <div class="flex items-center justify-between">
        <div>
            <div id="clock-time"
                class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 via-indigo-950 to-indigo-700 dark:from-white dark:via-indigo-200 dark:to-purple-200 bg-clip-text text-transparent tabular-nums font-mono">
                --:--:--
            </div>
            <div id="clock-date" class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 font-medium flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                <span>加载日期中...</span>
            </div>
        </div>
        <div class="w-11 h-11 rounded-2xl bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shadow-sm">
            <svg class="w-5 h-5 animate-spin" style="animation-duration: 20s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
    </div>
</div>
